name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Pack the package
        run: |
          cd imagekit-astro
          pnpm pack

      - name: Setup test-app with packed package
        run: |
          cd test-app
          pnpm remove @imagekit/astro || true
          pnpm add ../imagekit-astro/imagekit-astro-*.tgz

      - name: Install Playwright
        run: |
          cd test-app
          npx playwright install --with-deps

      - name: Run E2E tests
        run: |
          cd test-app
          pnpm test:e2e
        env:
          CI: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Install and Build
        run: |
          pnpm install
          pnpm build

      - name: NPM Publish
        run: |
          cd imagekit-astro
          npm config set //registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN
          # print the NPM user name for validation
          npm whoami
          VERSION=$(node -p "require('./package.json').version")
          # Only publish stable versions to the latest tag
          if [[ "$VERSION" =~ ^[^-]+$ ]]; then
            NPM_TAG="latest"
          else
            NPM_TAG="beta"
          fi
          echo "Publishing $VERSION with $NPM_TAG tag."
          npm publish --tag $NPM_TAG --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
          CI: true
